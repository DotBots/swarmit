name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

jobs:

  build-bootloader-and-sample:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: ["dotbot-v2", "dotbot-v3", "nrf5340dk"]
        config: ["Debug", "Release"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build bootloader
        run: BUILD_TARGET=${{ matrix.target }} BUILD_CONFIG=${{ matrix.config }} DOCKER_TARGETS=bootloader make docker
      - name: Build sample
        run: BUILD_TARGET=${{ matrix.target }} BUILD_CONFIG=${{ matrix.config }} DOCKER_TARGETS=sample make docker
      - name: Upload artifact
        if: matrix.config == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-bootloader-${{ matrix.target }}
          path: device/bootloader/Output/${{ matrix.target }}/${{ matrix.config }}/Exe/bootloader-${{ matrix.target }}.*

  build-netcore:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ["Debug", "Release"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build network core application
        run: BUILD_CONFIG=${{ matrix.config }} DOCKER_TARGETS=netcore make docker
      - name: Upload artifact
        if: matrix.config == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-netcore
          path: device/network_core/Output/nrf5340-net/${{ matrix.config }}/Exe/netcore-nrf5340-net.*

  build-mari-gateway:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config: ["Debug", "Release"]
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build mari gateway (app + net) for nrf5340dk
        working-directory: mari/firmware
        run: BUILD_CONFIG=${{ matrix.config }} DOCKER_TARGETS="gateway-app gateway-net" make docker
      - name: Stage mari gateway artifacts in a flat directory
        if: matrix.config == 'Debug'
        run: |
          mkdir -p stage
          cp mari/firmware/app/03app_gateway_app/Output/nrf5340-app/${{ matrix.config }}/Exe/03app_gateway_app-nrf5340-app.* stage/
          cp mari/firmware/app/03app_gateway_net/Output/nrf5340-net/${{ matrix.config }}/Exe/03app_gateway_net-nrf5340-net.* stage/
      - name: Upload artifact
        if: matrix.config == 'Debug'
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-mari-gateway
          path: stage/

  build-mari-gateway-schedules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          submodules: 'true'
      - name: Build one mari gateway net-core image per schedule
        run: BUILD_CONFIG=Debug DOCKER_TARGETS=mari-gateway-schedules make docker
      - name: Check each schedule produced a distinct image
        working-directory: mari/firmware/Output/schedules
        run: |
          sha256sum 03app_gateway_net-*.hex | tee SHA256SUMS
          for s in tiny medium big huge; do
            test -f "03app_gateway_net-$s.hex" || { echo "missing 03app_gateway_net-$s.hex"; exit 1; }
          done
          total=$(wc -l < SHA256SUMS)
          unique=$(cut -d' ' -f1 SHA256SUMS | sort -u | wc -l)
          if [ "$unique" -ne "$total" ]; then
            echo "schedule images are not all distinct ($unique unique of $total)"
            exit 1
          fi
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-mari-gateway-schedules
          path: mari/firmware/Output/schedules/03app_gateway_net-*.hex

  swarmit-check:
    name: swarmit-check (${{ matrix.os }}, python-${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: python -m pip install --upgrade --requirement tests_requirements.txt
    - name: Run tox
      run: tox
    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}

  typecheck_dashboard:
    name: Run TypeScript type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci
        working-directory: swarmit/dashboard/frontend

      - name: TypeScript type check
        run: npm run typecheck
        working-directory: swarmit/dashboard/frontend

  release:
    runs-on: ubuntu-latest
    needs:
      - build-netcore
      - build-bootloader-and-sample
      - build-mari-gateway
      - build-mari-gateway-schedules
      - swarmit-check
    if: >-
      github.event_name == 'push' &&
      startsWith(github.event.ref, 'refs/tags')
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install hatch
      - name: Build python package
        run: python -m hatch build
      - name: Check dist/ content
        run: ls -lR ./dist
      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.pypi_token }}
      - name: Download dotbot-v2 bootloader artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-bootloader-dotbot-v2
          path: ./artifacts
      - name: Download dotbot-v3 bootloader artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-bootloader-dotbot-v3
          path: ./artifacts
      - name: Download nrf5340dk bootloader artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-bootloader-nrf5340dk
          path: ./artifacts
      - name: Download netcore artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-netcore
          path: ./artifacts
      - name: Download mari gateway artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-mari-gateway
          path: ./artifacts
      - name: Download mari gateway schedule artifacts
        uses: actions/download-artifact@v4
        with:
          name: artifacts-mari-gateway-schedules
          path: ./artifacts
      - name: Release
        uses: ncipollo/release-action@v1
        with:
          generateReleaseNotes: true
          artifacts: "artifacts/*"
          token: ${{ secrets.github_token }}
